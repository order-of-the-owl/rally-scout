services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rally_scout
      POSTGRES_PASSWORD: rally_scout
      POSTGRES_DB: rally_scout
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rally_scout -d rally_scout']
      interval: 2s
      timeout: 3s
      retries: 30

  litellm:
    build: ./litellm
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
